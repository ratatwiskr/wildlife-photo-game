name: Build, Test, and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript installation
        run: npx tsc -v

      - name: Build TypeScript
        run: npm run build

#     - name: Run tests
#       run: npm test

#      - name: Validate scenes
#        run: npm run validate:scenes

      # Publish ONLY runtime files: the game must not depend on any dev-only
      # content (tests, CI configs, task docs, GIMP sources, …).
      - name: Stage runtime files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r scripts styles _site/
          rsync -a --exclude='*.xcf' --exclude='template/' assets _site/
          echo "📦 Staged files for GitHub Pages:"
          find _site -type f | sort

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
 
